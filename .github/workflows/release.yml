name: Build and Release

# Builds MSGTEncoder/MSGTDecoder in Release mode and publishes them as a GitHub
# Release whenever a tag matching v* is pushed (e.g. v1.0.0). Can also be run
# manually against the current branch for a build-only smoke test (no tag,
# so no release is published in that case).
#
# Runs on a self-hosted runner, not a GitHub-hosted one: this project's native
# dependencies (LibTorch, LAPACK, OSQP, Boost) are expected to already be set
# up on the runner exactly as documented in README.md's "How to build" section
# (this is what CMakePresets.json / CMakeUserPresets.json target) — this
# workflow does not attempt to install or reconstruct that environment. It
# does additionally require `patchelf` on PATH (e.g. `conda install -c
# conda-forge patchelf`), used by scripts/package_release.sh to produce a
# portable, extract-and-run archive — see that script and the "Releases / CI"
# section of README.md for what the resulting archive layout looks like.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default-profile

      - name: Build MSGTEncoder and MSGTDecoder
        run: cmake --build --preset default-profile-build --target MSGTEncoder --target MSGTDecoder

      - name: Package release archive
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          name="mule-sgt-${version}-linux-x86_64"
          scripts/package_release.sh build/new/bin "dist/${name}"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-sgt-linux-x86_64
          path: |
            mule-sgt-*-linux-x86_64.tar.gz
            mule-sgt-*-linux-x86_64.tar.gz.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mule-sgt-*-linux-x86_64.tar.gz
            mule-sgt-*-linux-x86_64.tar.gz.sha256
          generate_release_notes: true
